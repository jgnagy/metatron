apiVersion: v1
kind: Secret
metadata:
  name: widget-controller-auth
  namespace: __NAMESPACE__
  labels:
    app: widget-controller
type: Opaque
stringData:
  token: __AUTH_TOKEN__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: widget-controller
  namespace: __NAMESPACE__
  labels:
    app: widget-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: widget-controller
  template:
    metadata:
      labels:
        app: widget-controller
    spec:
      containers:
        - name: widget-controller
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9292
          env:
            - name: METATRON_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: widget-controller-auth
                  key: token
            - name: LOG_LEVEL
              value: info
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: widget-controller
  namespace: __NAMESPACE__
  labels:
    app: widget-controller
spec:
  selector:
    app: widget-controller
  ports:
    - name: http
      port: 9292
      targetPort: http
