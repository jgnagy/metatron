name: Integration

on:
  pull_request:
    paths:
      - "lib/**"
      - "integration/**"
      - "spec/integration/**"
      - "script/**"
      - ".github/workflows/integration.yml"
      - "metatron.gemspec"
      - "Gemfile"
      - "Gemfile.lock"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k3d:
    name: k3d ${{ matrix.k3d }} / metacontroller ${{ matrix.metacontroller }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        k3d: ["v5.8.3", "v5.9.0"]
        metacontroller: ["v4.16.7", "v4.17.6"]
    env:
      K3D_VERSION: ${{ matrix.k3d }}
      METACONTROLLER_VERSION: ${{ matrix.metacontroller }}
      K3D_CLUSTER_NAME: metatron-it-${{ github.run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install k3d
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
            | TAG="$K3D_VERSION" bash

      - name: Verify container tooling
        run: |
          docker version
          k3d version
          kubectl version --client

      - name: Run integration tests
        run: script/integration
